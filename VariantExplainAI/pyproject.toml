[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "variantexplainai"
version = "0.1.0"
description = "Allele-aware k-mer CNN sparse transformer for ClinVar pathogenicity prediction"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "pandas>=2", "scipy>=1.10", "scikit-learn>=1.3", "statsmodels>=0.14", "PyYAML>=6", "matplotlib>=3.7"]
[project.optional-dependencies]
genomics = ["pysam>=0.22"]
test = ["pytest>=7.4"]
[tool.setuptools.packages.find]
where = ["src"]
